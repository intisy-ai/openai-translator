import org.teavm.gradle.api.JSModuleType
import org.teavm.gradle.api.OptimizationLevel

plugins {
    id "org.teavm" version "0.15.0"
}

dependencies {
    // teavm transpiles :ir's + :openai's pure types -- no gson/net/nio/etc, matching their own
    // zero-dependency policy.
    githubImplementation "intisy-ai:basekit:4.0.0:ir"
    implementation project(":openai")
    // SOURCE-retention, so nothing here reaches the bundle. The processor jar is a release asset and
    // carries no transitive metadata, so the annotation types it reads are named beside it.
    githubCompileOnly "intisy-ai:api:1.7.0:annotations"
    githubAnnotationProcessor "intisy-ai:api:1.7.0:processor"
    githubAnnotationProcessor "intisy-ai:api:1.7.0:annotations"
    teavm teavm.libs.jsoApis
}

// The root subprojects{} block pins Java 8 (sourceCompatibility/targetCompatibility +
// compileJava --release 8) for portability of :ir/:openai. TeaVM 0.15.0's own classlib/jso-apis/
// extension-spi artifacts publish a minimum JVM-version metadata of 11-17, so :teavm-openai needs
// a newer compile target than :ir/:openai -- override both the extension's compatibility (fixes
// Gradle's dependency-resolution JVM-version attribute matching) and the compileJava task's
// --release option (which the root block sets via tasks.matching{}.configureEach{}, applied
// before this script runs, last-registered-wins). Mirrors basekit's ir-teavm/build.gradle exactly.
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.named("compileJava") {
    options.release = 17
    options.compilerArgs << "-Atsemit.name=openai-translator.teavm"
}

teavm.js {
    mainClass = "io.github.intisy.ai.js.OpenaiTranslatorJs"
    moduleType = JSModuleType.ES2015
    obfuscated = false
    optimization = OptimizationLevel.NONE
    targetFileName = "openai-translator.js"
}
