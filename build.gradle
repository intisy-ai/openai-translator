// The OpenAI translator's Java module, a self-contained Gradle build living alongside the TS
// (../src, ../package.json). Its one job is to compile and test the translator and TeaVM-transpile
// it to JS; github-gradle is applied only to resolve core-ir's published jars, not to publish.
plugins {
    id "io.github.intisy.github-gradle" version "1.10.3" apply false
}

subprojects {
    apply plugin: "java-library"
    apply plugin: "io.github.intisy.github-gradle"

    github {
        accessToken = System.getenv("GITHUB_TOKEN") ?: ""
    }

    group = "io.github.intisy"
    // publishGithub requires a concrete version. Derive it from -Partifact_version=<tag> passed
    // by CI (stripping a leading "v"), falling back to a local dev version.
    version = (project.findProperty("artifact_version") ?: "0.0.0-dev").toString().replaceFirst(/^v/, "")

    repositories {
        mavenLocal()
        mavenCentral()
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8

        // 17 is which JDK COMPILES; options.release = 8 below is which JVM RUNS the output. The
        // floor is 17 because TeaVM 0.15.0's artifacts publish minimum-JVM metadata above 8.
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    // All Java source, main and test alike, must stay within the JDK 1.8 API surface; javac enforces it.
    tasks.matching { it.name == "compileJava" || it.name == "compileTestJava" }.configureEach {
        options.release = 8
    }

    dependencies {
        testImplementation "org.junit.jupiter:junit-jupiter:5.10.1"
    }

    test {
        useJUnitPlatform()
    }

    tasks.withType(Javadoc).configureEach {
        options.addBooleanOption("Xdoclint:all", true)
        // javadoc stops listing after 100 of each kind by default, which silently under-reports the gap.
        options.addStringOption("Xmaxwarns", "10000")
        options.addStringOption("Xmaxerrs", "10000")
        // doclint reports a missing comment as a WARNING, and failOnError only fails on errors, so
        // without this the task passes over an entirely undocumented module.
        options.addBooleanOption("Werror", true)
        options.tags = [
            "apiNote:a:API Note:",
            "implSpec:a:Implementation Requirements:",
            "implNote:a:Implementation Note:",
        ]
        failOnError = true
    }

    // check does not run javadoc by default, so without this a doclint finding fails no build.
    tasks.named("check") { dependsOn tasks.named("javadoc") }
}

// The module a downstream java consumer resolves, mapped to the classifier its coordinate names.
ext.PUBLISHED_MODULES = [
    ":openai": "openai",
]

configure(subprojects.findAll { PUBLISHED_MODULES.containsKey(it.path) }) {
    jar {
        archiveVersion = ""
    }

    publishGithub {
        // These modules sit inside this repo with no .git of their own, so the default git-remote
        // lookup fails; owner/repo also drive the uploaded asset name (openai-translator-<classifier>.jar).
        owner = "intisy-ai"
        repo = "openai-translator"
        releaseName = "openai-translator ${project.findProperty('artifact_version') ?: project.version}"
        artifacts {
            artifact {
                classifier = PUBLISHED_MODULES[project.path]
                jar = file("build/libs/${project.name}.jar")
            }
        }
    }
}

// A publish fanned out to every subproject would fail on the ones with no artifacts declared.
subprojects {
    tasks.matching { it.name == "publishGithub" }.configureEach {
        onlyIf { project.path in rootProject.PUBLISHED_MODULES.keySet() }
    }
}
