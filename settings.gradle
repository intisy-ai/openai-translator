plugins {
    id "org.gradle.toolchains.foojay-resolver-convention" version "0.8.0"
}

rootProject.name = "openai-translator-java"

// :ir is core-ir's neutral IR module, reached via the nested core-ir submodule (path re-declared
// here, the ecosystem convention: Gradle settings do not nest, so every consumer re-declares it).
include ":ir"
project(":ir").projectDir = file("core-ir/ir")

// :annotations, :processor and :contract come from api, reached through core-ir's own api submodule
// because :ir exports api's seam types in HandlerCtx's public fields and emits its own TypeScript,
// so any build including :ir must resolve api at the same coordinates.
include ":annotations"
project(":annotations").projectDir = file("core-ir/api/annotations")
include ":processor"
project(":processor").projectDir = file("core-ir/api/processor")
include ":contract"
project(":contract").projectDir = file("core-ir/api/contract")

// :openai       - the OpenAI translator + codecs (Java 8, zero-dep, TeaVM-clean).
// :teavm-openai - TeaVM JS export surface over :openai + :ir.
include ":openai"
include ":teavm-openai"
