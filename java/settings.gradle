plugins {
    id "org.gradle.toolchains.foojay-resolver-convention" version "0.8.0"
}

rootProject.name = "openai-translator-java"

// :ir is core-ir's neutral IR module, reached via the nested core-ir submodule (path re-declared
// here, the ecosystem convention: Gradle settings do not nest, so every consumer re-declares it).
include ":ir"
project(":ir").projectDir = file("../core-ir/java/ir")

// :openai       - the OpenAI translator + codecs (Java 8, zero-dep, TeaVM-clean).
// :teavm-openai - TeaVM JS export surface over :openai + :ir.
include ":openai"
include ":teavm-openai"
